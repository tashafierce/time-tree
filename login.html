<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="css/default.css" />
		<!--<base href="" />-->
	</head>
	<title>Time.Tree Login</title>
	<body class="flex-col">
		<div class="center flex-row">
			<img src="img/tt-logo.png" class="logo-med" />
		</div>
		<div id="login" class="center flex-col">
			<form action="js/login.js" name="login_form" id="login_form" class="login">
				<input type="hidden" name="login_token" id="login_token">
				<input name="user" id="user" type="text" placeholder="Username" />
				<input name="password" id="password" type="password" placeholder="Password" />
				<button type="submit" name="submit" id="submit">Log In!</button>
			</form>
	</body>
</html>
